<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Store Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
📱 Mobile Store Pro
</header>

<!-- SEARCH -->
<div class="topbar">
<input type="text" id="search" placeholder="Search products..." onkeyup="renderProducts()">
</div>

<!-- LAYOUT -->
<div class="layout">

    <!-- PRODUCTS -->
    <div class="products">
        <div class="section-title">🔥 Products</div>
        <div id="products"></div>
    </div>

    <!-- CART -->
    <div class="cart">
        <div class="section-title">🛒 Cart</div>
        <div id="cart"></div>
        <div class="total" id="total">Total: Tsh 0</div>
        <button class="checkout" onclick="checkout()">WhatsApp Checkout</button>
    </div>

</div>

<footer>

</footer>

<script src="script.js"></script>

</body>
</html>
